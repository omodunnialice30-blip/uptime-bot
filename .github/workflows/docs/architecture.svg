<svg width="900" height="640" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="900" height="640" fill="#ffffff"/>
  <text x="450" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">Uptime Bot — Architecture</text>

  <rect x="60" y="70" width="780" height="110" rx="10" fill="#eef4ff" stroke="#3b6fd6" stroke-width="2"/>
  <text x="450" y="95" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a3a7a">GitHub Actions — monitor.yml</text>
  <text x="450" y="118" text-anchor="middle" font-size="13" fill="#2a2a2a">Triggers: cron (every 10 min) + manual workflow_dispatch</text>
  <text x="450" y="140" text-anchor="middle" font-size="13" fill="#2a2a2a">Steps: checkout to set up Python to install deps to restore cache</text>
  <text x="450" y="162" text-anchor="middle" font-size="13" fill="#2a2a2a">to run main.py to save cache (state.json)</text>

  <line x1="450" y1="180" x2="450" y2="215" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="260" y="220" width="380" height="70" rx="8" fill="#fff4e5" stroke="#d98a1f" stroke-width="2"/>
  <text x="450" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a5200">src/main.py</text>
  <text x="450" y="266" text-anchor="middle" font-size="12" fill="#2a2a2a">Orchestrates checks, tracks failure counts, triggers alerts</text>

  <line x1="450" y1="290" x2="450" y2="315" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="60" y="320" width="230" height="90" rx="8" fill="#e9f9ee" stroke="#2f9e52" stroke-width="2"/>
  <text x="175" y="345" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c5c31">checker.py</text>
  <text x="175" y="365" text-anchor="middle" font-size="11" fill="#2a2a2a">HTTP GET each target</text>
  <text x="175" y="382" text-anchor="middle" font-size="11" fill="#2a2a2a">to UP/DOWN + latency</text>

  <rect x="335" y="320" width="230" height="90" rx="8" fill="#f2eefc" stroke="#7a4fd6" stroke-width="2"/>
  <text x="450" y="345" text-anchor="middle" font-size="13" font-weight="bold" fill="#452b8a">logs/state.json</text>
  <text x="450" y="365" text-anchor="middle" font-size="11" fill="#2a2a2a">Consecutive failure count</text>
  <text x="450" y="382" text-anchor="middle" font-size="11" fill="#2a2a2a">per target (persisted via cache)</text>

  <rect x="610" y="320" width="230" height="90" rx="8" fill="#fdeaea" stroke="#c9403a" stroke-width="2"/>
  <text x="725" y="345" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a1f1a">alerts.py</text>
  <text x="725" y="365" text-anchor="middle" font-size="11" fill="#2a2a2a">POST to Slack webhook</text>
  <text x="725" y="382" text-anchor="middle" font-size="11" fill="#2a2a2a">on threshold breach / recovery</text>

  <line x1="725" y1="410" x2="725" y2="450" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="600" y="455" width="250" height="70" rx="8" fill="#e9f0ff" stroke="#4a154b" stroke-width="2"/>
  <text x="725" y="480" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a154b">Slack #alerts channel</text>
  <text x="725" y="500" text-anchor="middle" font-size="11" fill="#2a2a2a">DOWN / RECOVERED messages</text>

  <line x1="175" y1="410" x2="175" y2="450" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="60" y="455" width="250" height="70" rx="8" fill="#f5f5f5" stroke="#777" stroke-width="2"/>
  <text x="185" y="480" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">logs/uptime.log</text>
  <text x="185" y="500" text-anchor="middle" font-size="11" fill="#2a2a2a">Timestamped check history</text>

  <rect x="60" y="550" width="780" height="60" rx="8" fill="#f0f0f0" stroke="#999" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="450" y="575" text-anchor="middle" font-size="12" fill="#333">Also runnable standalone via Docker: same src/ code, containerized with a</text>
  <text x="450" y="593" text-anchor="middle" font-size="12" fill="#333">python:3.11-slim base image, for local testing or alternative deployment</text>
</svg>
